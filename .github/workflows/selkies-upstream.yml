name: Selkies dashboard upstream

on:
  workflow_dispatch:
  schedule:
    - cron: "0 14 * * 1-5"

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const TITLE = 'Selkies dashboard upstream moved';
            const raw = fs.readFileSync('chrome/selkies-dashboard/UPSTREAM', 'utf8');
            const pinned = (raw.match(/^commit=(.+)$/m) || [])[1];
            if (!pinned) {
              core.setFailed('chrome/selkies-dashboard/UPSTREAM is missing commit=');
              return;
            }
            const { data: commits } = await github.rest.repos.listCommits({
              owner: 'selkies-project',
              repo: 'selkies',
              path: 'addons/selkies-dashboard',
              per_page: 1,
            });
            if (!commits.length) {
              core.setFailed('GitHub returned no commits for addons/selkies-dashboard');
              return;
            }
            const latest = commits[0].sha;
            core.info(`pinned=${pinned} latest=${latest}`);
            if (latest === pinned) {
              core.info('Selkies dashboard path is at the pinned commit.');
              return;
            }
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            if (open.some((issue) => issue.title === TITLE)) {
              core.info('An open issue with this title already exists; not opening another.');
              return;
            }
            const body = [
              'The vendored Selkies dashboard pin is behind upstream.',
              '',
              `- Pinned: \`${pinned}\``,
              `- Latest commit on \`addons/selkies-dashboard\`: \`${latest}\``,
              `- Upstream: https://github.com/selkies-project/selkies/commits/${latest}/addons/selkies-dashboard`,
              `- Compare: https://github.com/selkies-project/selkies/compare/${pinned}...${latest}`,
              '',
              'Bump with:',
              '',
              '```',
              `scripts/sync-selkies-dashboard.sh ${latest}`,
              '```',
              '',
              'If patches fail to apply, refresh `chrome/patches/selkies-dashboard/` against the new tree. Do not auto-merge a broken apply. Overlay files in `chrome/selkies-dashboard/OVERLAY` must stay.',
            ].join('\n');
            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: TITLE,
              body,
            });
            core.info(`Opened ${issue.data.html_url}`);
