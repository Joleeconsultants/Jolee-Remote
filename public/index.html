<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Jolee Remote</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<link rel="stylesheet" href="/dashboard/dashboard.css" />
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden}
#jolee-core{position:fixed;inset:0;width:100%;height:100%;border:0;background:#000}
#root{position:relative;z-index:1}
</style>
</head>
<body>
<iframe id="jolee-core" title="Session hop core" allow="fullscreen; clipboard-read; clipboard-write"></iframe>
<div id="root"></div>
<script>
(function () {
  var search = new URLSearchParams(location.search);
  var hash = new URLSearchParams((location.hash || "").replace(/^#/, ""));
  var token = hash.get("token") || search.get("token") || "";
  search.delete("token");
  search.set("embedded", "1");
  var src = "/viewer.html?" + search.toString();
  if (token) src += "#token=" + encodeURIComponent(token);
  document.getElementById("jolee-core").src = src;
})();
</script>
<script type="module" src="/dashboard/dashboard.js"></script>
</body>
</html>
