<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Session hop core</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden}
main{padding:0;height:100%}
canvas{display:block;width:100%;height:100%;background:#000;object-fit:contain}
canvas.stretch{object-fit:fill}
#vk{display:none}
#vk.show{display:block;position:absolute;left:-9999px}
</style></head>
<body>
<main>
<canvas id="surface" width="640" height="360" tabindex="0"></canvas>
<input id="vk" type="text" autocomplete="off" aria-hidden="true" />
</main>
<script type="module">
// Must match root package.json partysocket (currently 1.1.6).
import PartySocket from "https://esm.sh/partysocket@1.1.6";
const VERSION=1, KIND_FRAME=1, KIND_INPUT=2;
const canvas=document.getElementById("surface");
const vk=document.getElementById("vk");
const ctx=canvas.getContext("2d");
const params=new URLSearchParams(location.search);
const hashParams=new URLSearchParams((location.hash||"").replace(/^#/, ""));
let session=params.get("session")||"";
let token=hashParams.get("token")||params.get("token")||"";
let hop=params.get("hop")||"";
let socket=null, videoDecoder=null, scaleLocally=true, antiAliasing=true;
function applyScale(){
  canvas.classList.toggle("stretch", !scaleLocally);
}
function applySmoothing(){
  ctx.imageSmoothingEnabled=!!antiAliasing;
  ctx.imageSmoothingQuality=antiAliasing?"high":"low";
}
function setStatus(state){
  if(window.parent!==window){
    window.parent.postMessage({type:"status",state}, window.location.origin);
  }
}
function encodeInput(payload){const body=new TextEncoder().encode(JSON.stringify(payload));const out=new Uint8Array(2+body.length);out[0]=VERSION;out[1]=KIND_INPUT;out.set(body,2);return out;}
function decodeEnvelope(data){const bytes=data instanceof ArrayBuffer?new Uint8Array(data):new Uint8Array(data);if(bytes.length<2||bytes[0]!==VERSION)return null;if(bytes[1]!==KIND_FRAME&&bytes[1]!==KIND_INPUT)return null;return {kind:bytes[1]===KIND_FRAME?"frame":"input",payload:bytes.subarray(2)};}
function clipboardTextFromFrame(payload){
  try{
    let i=0;
    while(i<payload.length&&(payload[i]===0x20||payload[i]===0x09||payload[i]===0x0a||payload[i]===0x0d)) i++;
    if(i>=payload.length||payload[i]!==0x7b) return null;
    const obj=JSON.parse(new TextDecoder().decode(payload));
    if(obj&&typeof obj==="object"&&(obj.t==="clipboard"||obj.type==="clipboard")&&typeof obj.text==="string") return obj.text;
  }catch(e){}
  return null;
}
async function paintJpegOrPng(payload){const bitmap=await createImageBitmap(new Blob([payload]));canvas.width=bitmap.width;canvas.height=bitmap.height;applySmoothing();ctx.drawImage(bitmap,0,0);bitmap.close();}
async function paintH264(payload){if(typeof VideoDecoder==="undefined")throw new Error("no WebCodecs");if(!videoDecoder||videoDecoder.state==="closed"){videoDecoder=new VideoDecoder({output:(frame)=>{canvas.width=frame.displayWidth;canvas.height=frame.displayHeight;applySmoothing();ctx.drawImage(frame,0,0);frame.close();},error:()=>{}});videoDecoder.configure({codec:"avc1.42E01E"});}videoDecoder.decode(new EncodedVideoChunk({type:payload.length>4&&payload[4]===5?"key":"delta",timestamp:performance.now()*1000,data:payload}));}
async function paintFrame(payload){try{await paintJpegOrPng(payload);return;}catch(e){}try{await paintH264(payload);}catch(e){ctx.fillStyle="#000";ctx.fillRect(0,0,canvas.width,canvas.height);ctx.fillStyle="#888";ctx.fillText("opaque frame "+payload.length+" bytes",16,24);}}
function disconnect(){if(socket){socket.close();socket=null;}if(videoDecoder){try{videoDecoder.close();}catch(e){}videoDecoder=null;}setStatus("disconnected");}
function connect(opts){
  if(opts&&typeof opts==="object"){
    if(typeof opts.session==="string") session=opts.session;
    if(typeof opts.token==="string") token=opts.token;
    if(typeof opts.hop==="string") hop=opts.hop;
  }
  session=session.trim();
  token=token.trim();
  hop=hop.trim();
  const host=hop||location.host;
  if(!session||!token){setStatus("disconnected");return;}
  disconnect();
  const url=new URL(location.href);
  url.searchParams.set("session",session);
  url.searchParams.delete("token");
  if(hop)url.searchParams.set("hop",hop);else url.searchParams.delete("hop");
  url.hash=token?"token="+encodeURIComponent(token):"";
  history.replaceState(null,"",url);
  socket=new PartySocket({host:host,party:"session",room:session,query:{token:token,role:"browser"}});
  socket.binaryType="arraybuffer";
  socket.addEventListener("open",()=>setStatus("waiting"));
  socket.addEventListener("close",()=>setStatus("disconnected"));
  socket.addEventListener("message",(ev)=>{
    if(typeof ev.data==="string"){
      try{const msg=JSON.parse(ev.data);if(msg.type==="status")setStatus(msg.state);}catch(e){}
      return;
    }
    const env=decodeEnvelope(ev.data);
    if(!(env&&env.kind==="frame")) return;
    const clip=clipboardTextFromFrame(env.payload);
    if(clip!==null){
      if(window.parent!==window){
        window.parent.postMessage({type:"clipboardContentUpdate",text:clip}, window.location.origin);
      }
      return;
    }
    paintFrame(env.payload);
  });
}
function sendInput(payload){if(!socket||socket.readyState!==1)return;socket.send(encodeInput(payload));}
function requestFullscreen(){
  const req=canvas.requestFullscreen||canvas.webkitRequestFullscreen;
  if(req) Promise.resolve(req.call(canvas)).catch(()=>{});
}
function showVirtualKeyboard(){
  canvas.focus();
  vk.classList.add("show");
  vk.focus();
}
function clipboardUpdateFromUI(text){
  sendInput({t:"clipboard",text:String(text||"")});
}
canvas.addEventListener("pointermove",(e)=>{const r=canvas.getBoundingClientRect();sendInput({t:"pointer",e:"move",x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height,b:e.buttons});});
canvas.addEventListener("pointerdown",(e)=>{canvas.setPointerCapture(e.pointerId);const r=canvas.getBoundingClientRect();sendInput({t:"pointer",e:"down",x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height,b:e.button});});
canvas.addEventListener("pointerup",(e)=>{const r=canvas.getBoundingClientRect();sendInput({t:"pointer",e:"up",x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height,b:e.button});});
canvas.addEventListener("keydown",(e)=>{sendInput({t:"key",e:"down",key:e.key,code:e.code});e.preventDefault();});
canvas.addEventListener("keyup",(e)=>{sendInput({t:"key",e:"up",key:e.key,code:e.code});e.preventDefault();});
vk.addEventListener("keydown",(e)=>{sendInput({t:"key",e:"down",key:e.key,code:e.code});});
vk.addEventListener("keyup",(e)=>{sendInput({t:"key",e:"up",key:e.key,code:e.code});});
window.addEventListener("message",(event)=>{
  if(event.origin!==window.location.origin) return;
  if(window.parent!==window && event.source!==window.parent) return;
  const msg=event.data;
  if(!msg||typeof msg!=="object") return;
  switch(msg.type){
    case "connect": connect(msg); break;
    case "disconnect": disconnect(); break;
    case "requestFullscreen": requestFullscreen(); break;
    case "setScaleLocally":
      scaleLocally=!!msg.value;
      applyScale();
      break;
    case "showVirtualKeyboard": showVirtualKeyboard(); break;
    case "clipboardUpdateFromUI": clipboardUpdateFromUI(msg.text); break;
    case "assistKey":
      sendInput({t:"key",e:msg.e==="up"?"up":"down",key:msg.key,code:msg.code});
      break;
    case "setAntiAliasing":
      antiAliasing=!!msg.value;
      applySmoothing();
      break;
    case "setUseBrowserCursors":
      canvas.style.cursor=msg.value?"default":"none";
      break;
    // Hidden Selkies chrome: encoder, audio, gamepad, capture resize, image clipboard.
    case "pipelineControl":
    case "settings":
    case "gamepadControl":
    case "setManualResolution":
    case "resetResolutionToWindow":
    case "setUseCssScaling":
    case "audioDeviceSelected":
    case "requestGamingMode":
    case "command":
    case "getStats":
    case "sidebarVisibilityChanged":
    case "TOUCH_GAMEPAD_SETUP":
    case "TOUCH_GAMEPAD_VISIBILITY":
    case "touchinput:trackpad":
    case "touchinput:touch":
    case "setSynth":
    case "clipboardImageUpdate":
    case "mode":
      break;
    default:
      break;
  }
});
applyScale();
applySmoothing();
setStatus("disconnected");
if(session.trim()&&token.trim()) connect();
</script></body></html>
